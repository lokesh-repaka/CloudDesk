name: Terraform Lint & Validate

on:
  push:
    branches: [main, development, testing]
    paths:
      - "deployment/**"
      - ".github/workflows/terraform-validate.yml"
  pull_request:
    branches: [main, development, testing]
    paths:
      - "deployment/**"
      - ".github/workflows/terraform-validate.yml"

permissions:
  contents: read

jobs:
  terraform-validate:
    name: Validate Terraform Roots
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cloud: [aws, azure, gcp]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive deployment/${{ matrix.cloud }}

      - name: Initialize Terraform (backend-less)
        run: terraform -chdir=deployment/${{ matrix.cloud }} init -backend=false

      - name: Validate Terraform configuration
        run: terraform -chdir=deployment/${{ matrix.cloud }} validate

